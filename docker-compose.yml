version: '3.8'

services:
    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_DB: avia_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - postgres_data:/var/lib/postgresql/data

app:
    build: .
    restart: always
    ports:
        - "127.0.0.1:5000:5000"
    depends_on:
        - db

volumes:
    postgres_data: