<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решись Авиа вход в систему</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <h2 id="auth-title">🔐 Вход в систему</h2>
        
        <div id="auth-form">
            <div class="form-group">
                <label for="username">Имя пользователя (Логин)</label>
                <input type="text" id="username" placeholder="Введите ваш логин..." required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите ваш пароль..." required>
            </div>

            <button type="button" id="btn-login">Войти</button> 
            <button type="button" id="btn-register" style="background-color: transparent; color: var(--primary-color); margin-top: 10px; border: 1px solid var(--primary-color);">Создать аккаунт</button>
        </div>

        <p id="auth-message" style="display: none; margin-top: 15px; font-size: 14px; font-weight: 600; text-align: center; transition: color 0.2s;"></p>
    </div>

    <script src="./auth.js"></script>
</body>
</html>
